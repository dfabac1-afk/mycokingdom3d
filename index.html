<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Myco Quest | Myco Kingdom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
      // Early silence for noisy library warnings
      (function() {
        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (typeof args[0] === 'string' && (
            args[0].includes('bigint: Failed to load bindings') || 
            args[0].includes('Shared Storage API is deprecated') ||
            args[0].includes('The AudioContext was not allowed to start')
          )) return;
          originalWarn.apply(console, args);
        };
        // Mock process for Web3 libs
        window.process = { env: {} };
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "tone": "https://esm.sh/tone@14.7.77",
          "@solana/web3.js": "https://esm.sh/@solana/web3.js@1.87.6"
        }
      }
    </script>
    <style>
      html, body, #game-container { width: 100%; height: 100%; margin: 0; padding: 0; background-color: black; overflow: hidden; }
      /* V1.9.31 - Scoped touch-action. Previously `body { touch-action: none }`
         disabled all native tap/scroll behavior page-wide, which broke menu
         buttons and prevented scrollable content (story crawl, settings) from
         working on phones. We now disable native gestures only on the canvas
         and the joystick/button overlay; HTML menus get normal behavior. */
      #game-container, canvas { touch-action: none; }
      
      .neon-text {
        color: #fff;
        text-shadow: 0 0 5px #fff, 0 0 10px #39FF14, 0 0 20px #39FF14, 0 0 40px #39FF14;
      }

      .scrolling-story {
        position: absolute;
        top: 100%;
        width: 80%;
        max-width: 800px;
        text-align: center;
        animation: scrollText 30s linear forwards;
      }

      @keyframes scrollText {
        0% { top: 100%; }
        100% { top: -150%; }
      }

      .clan-card {
        padding: 20px;
        margin: 10px;
        border: 2px solid #fff;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
        text-align: center;
        width: 250px;
      }
      .clan-card:hover {
        transform: scale(1.05);
        background: rgba(255,255,255,0.1);
      }
      
      button {
        cursor: pointer;
        font-family: 'Press Start 2P', cursive;
        transition: transform 0.1s;
      }
      button:active {
        transform: scale(0.95);
      }
    </style>
</head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="main.js"></script>
</body>
</html>
